# Read the Docs build configuration.
# The API reference uses mkdocstrings, which imports `sigway` at build time,
# so the package itself is installed (pulling jax, diffrax, …) alongside the
# documentation requirements.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
    - requirements: requirements-docs.txt
