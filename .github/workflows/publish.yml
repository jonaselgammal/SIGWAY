# Publish SIGWAY to PyPI on a GitHub Release, using PyPI Trusted Publishing
# (OIDC — no API tokens stored in the repo).
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:      sigway
#   Owner:             jonaselgammal
#   Repository name:   SIGWAY
#   Workflow filename: publish.yml
#   Environment:       (leave blank, or set to "pypi" and uncomment below)
#
# Then: bump the version in pyproject.toml, create a GitHub Release (tag e.g.
# v0.2), and this workflow builds and uploads the sdist + wheel automatically.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # environment: pypi          # uncomment if you configure a "pypi" environment
    permissions:
      id-token: write            # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
