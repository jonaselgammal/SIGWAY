site_name: SIGWAY
site_description: Scalar-Induced Gravitational Wave AnalYsis
site_url: https://jonaselgammal.github.io/SIGWAY/
repo_url: https://github.com/jonaselgammal/SIGWAY
repo_name: jonaselgammal/SIGWAY
edit_uri: edit/docs/docs/

theme:
  name: material
  logo: assets/images/mark.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Enabled locally once the package is importable (need jax etc.):
  # - mkdocstrings:
  #     handlers: { python: { options: { docstring_style: numpy } } }
  # - mkdocs-jupyter

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Simple example: getting-started/simple-example.md
      - Advanced example: getting-started/advanced-example.md
  - Theory & modelling: theory/index.md
  - API reference: api/index.md
  - Extensions: extensions/index.md
